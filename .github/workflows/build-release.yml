name: Build & Release APK

on:
  push:
    branches: [main]
    paths-ignore: ['desktop/**', '.github/workflows/build-desktop.yml', 'README.md']
  workflow_dispatch:
    inputs:
      abis:
        description: 'CPU đóng gói, ngăn cách bằng dấu phẩy (mặc định đủ 4 loại để chạy mọi máy Android 7+)'
        default: 'armeabi-v7a,arm64-v8a,x86,x86_64'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Giải mã khóa ký
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon -Pabis="${{ github.event.inputs.abis || 'armeabi-v7a,arm64-v8a,x86,x86_64' }}"

      - name: Lưu APK để tải
        uses: actions/upload-artifact@v4
        with:
          name: NewOS-apk
          path: |
            app/build/outputs/apk/release/*.apk
          retention-days: 7
