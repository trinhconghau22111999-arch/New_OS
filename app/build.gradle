plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
dependencies {
    implementation 'androidx.core:core:1.13.1'
    // ---- App con "Duyệt web" (chép từ repo Webandr) ----
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
android {
    namespace 'com.desktopmini.launcher'
    compileSdk 34
    defaultConfig {
        applicationId 'com.newos.launcher'
        minSdk 24
        targetSdk 34
        // Mỗi lần build trên GitHub Actions số phiên bản tự tăng (run_number) để cài đè được bản cũ
        def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionCode run
        versionName "1.0.${run}"
        // Chạy trên mọi máy Android 7.0 (API 24) trở lên: mặc định đóng gói đủ 4 loại CPU (ARM 32/64-bit, Intel 32/64-bit).
        // Muốn APK nhẹ hơn cho một loại máy: -Pabis=x86 (ví dụ Lenovo Yoga Book) hoặc -Pabis=arm64-v8a
        def abis = ((project.findProperty('abis') ?: 'armeabi-v7a,arm64-v8a,x86,x86_64') as String).split(',').collect { it.trim() }.findAll { it }
        ndk { abiFilters.addAll(abis) }
        // Chỉ giữ tài nguyên tiếng Việt + tiếng Anh của các thư viện (bỏ hàng chục ngôn ngữ không dùng) cho APK nhẹ hơn
        resConfigs 'vi', 'en'
    }
    signingConfigs {
        release {
            // Chữ ký cố định lấy từ GitHub Secrets; build máy khác không có thì dùng chữ ký debug
            def ksPath = System.getenv('KEYSTORE_PATH')
            if (ksPath && new File(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release.storeFile ? signingConfigs.release : signingConfigs.debug
            // R8: bỏ code/tài nguyên không dùng. Quy tắc giữ cầu JavaScript nằm trong proguard-rules.pro
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError false; checkReleaseBuilds false }
    // Các mảnh WebView (zip đã nén sẵn) trong assets/webview: không nén lại để build nhanh và đọc nhanh
    androidResources { noCompress += ['part', 'apk'] }
    packaging {
        jniLibs { useLegacyPackaging = true }
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/INDEX.LIST']
    }
}
